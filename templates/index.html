<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .weather-card {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px;
            width: 380px;
            color: white;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .search-box input {
            border-radius: 50px;
            border: none;
            padding: 10px 15px;
        }

        .search-box button {
            border-radius: 50px;
            padding: 10px 20px;
        }

        .temp {
            font-size: 55px;
            font-weight: 600;
        }

        .weather-icon {
            width: 100px;
        }

        .details {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .details div {
            text-align: center;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="weather-card">

    <h3 class="mb-3">🌦 Weather App</h3>

    <form method="POST" class="search-box d-flex">
        {% csrf_token %}
        <input type="text" name="city" class="form-control me-2" placeholder="Enter city">
        <button class="btn btn-light">Search</button>
    </form>

    {% if weather %}
        {% if weather.error %}
            <div class="error mt-3">{{ weather.error }}</div>
        {% else %}
            <h4 class="mt-4">{{ weather.city }}</h4>

            <img class="weather-icon"
                 src="http://openweathermap.org/img/wn/{{ weather.icon }}@2x.png">

            <div class="temp">{{ weather.temperature }}°C</div>

            <p class="text-capitalize">{{ weather.description }}</p>

            <div class="details">
                <div>
                    <p>💧</p>
                    <p>{{ weather.humidity }}%</p>
                    <small>Humidity</small>
                </div>
                <div>
                    <p>🌡️</p>
                    <p>{{ weather.temperature }}°C</p>
                    <small>Temp</small>
                </div>
            </div>
        {% endif %}
    {% endif %}

</div>

</body>
</html>
